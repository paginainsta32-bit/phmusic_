<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Spotify - Jamendo Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🎵 Jamendo Stream</h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar música, artista ou gênero (ex: rock)...">
        <button id="searchBtn">Buscar</button>
      </div>
    </header>

    <main id="resultsList" class="results-grid">
      <!-- Músicas vão aparecer aqui -->
    </main>

    <!-- Player Fixo no Rodapé -->
    <footer class="player-bar">
      <div class="track-info">
        <img id="playerThumb" src="https://via.placeholder.com/60" alt="Capa">
        <div>
          <p id="playerTitle">Nenhuma música selecionada</p>
          <span id="playerChannel">-</span>
        </div>
      </div>
      
      <!-- Control do Áudio Nativo sem Anúncios -->
      <div class="audio-container">
        <audio id="audioPlayer" controls autoplay style="width: 100%; max-width: 400px; height: 40px;"></audio>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
