<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Spotify - YouTube Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🎵 Meu Spotify</h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar artista nacional, música, banda...">
        <button id="searchBtn">Buscar</button>
      </div>
    </header>

    <main id="resultsList" class="results-grid">
      <!-- Músicas renderizadas aqui -->
    </main>

    <!-- Player Fixo no Rodapé -->
    <footer class="player-bar">
      <div class="track-info">
        <img id="playerThumb" src="https://via.placeholder.com/60" alt="Capa">
        <div>
          <p id="playerTitle">Nenhuma música selecionada</p>
          <span id="playerChannel">-</span>
        </div>
      </div>
      
      <!-- Container do vídeo minimizado (1x1px para manter o áudio rodando oficial) -->
      <div class="yt-hidden">
        <div id="youtubePlayer"></div>
      </div>
    </footer>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
